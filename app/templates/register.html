{% extends "base.html" %}

{% block title %}Register - Culex{% endblock %}

{% block extra_styles %}
<style>
    .register-container { min-height: calc(100vh - 400px); display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
    .register-box { background: #FFF; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 28rem; width: 100%; border: 1px solid #E2E8F0; }
    .register-title { font-size: 2rem; font-weight: 700; color: #1E293B; text-align: center; margin-bottom: 2rem; }
    .register-subtitle { text-align: center; color: #64748B; margin-bottom: 2rem; }
    .register-footer { text-align: center; margin-top: 1.5rem; color: #64748B; }
    .register-footer a { color: #2563EB; text-decoration: none; font-weight: 600; }
    .register-footer a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-box">
        <h2 class="register-title">Create Account</h2>
        <p class="register-subtitle">Join Culex and start booking</p>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>
        
        <p class="register-footer">
            Already have an account? 
            <a href="{{ url_for('main.login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
