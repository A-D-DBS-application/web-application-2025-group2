<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to De Kodak</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #fafbfc;
            font-family: 'Montserrat', sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 48px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 40px 32px 24px 32px;
        }
        h2 {
            text-align: center;
            margin-bottom: 32px;
            font-weight: 500;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fafbfc;
        }
        .btn {
            width: 100%;
            background: #1E88E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1565C0;
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 1rem;
        }
        .register-link a {
            color: #1766b3;
            font-weight: 600;
            text-decoration: none;
        }
        .error-message {
            color: #d32f2f;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to De Kodak</h2>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn">Login</button>
        </form>
        <div class="register-link">
            Don't have an account? <a href="{{ url_for('main.register') }}">Register</a>
        </div>
    </div>
</body>
</html>
