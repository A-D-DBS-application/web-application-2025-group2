{% extends "base.html" %}

{% block title %}Login - Culex{% endblock %}

{% block extra_styles %}
<style>
    .login-container { min-height: calc(100vh - 400px); display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
    .login-box { background: #FFF; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 28rem; width: 100%; border: 1px solid #E2E8F0; }
    .login-title { font-size: 2rem; font-weight: 700; color: #1E293B; text-align: center; margin-bottom: 2rem; }
    .login-subtitle { text-align: center; color: #64748B; margin-bottom: 2rem; }
    .login-footer { text-align: center; margin-top: 1.5rem; color: #64748B; }
    .login-footer a { color: #2563EB; text-decoration: none; font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Login to your Culex account</p>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <p class="login-footer">
            Don't have an account? 
            <a href="{{ url_for('main.register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
