<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Photographer - De Kodak</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fafbfc;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }
        .nav-links a {
            margin-left: 30px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 32px;
            color: #333;
        }
        .success-message {
            background: #4caf50;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn {
            width: 100%;
            background: #1E88E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1565C0;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">De Kodak</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">HOME</a>
        </div>
    </nav>

    <div class="container">
        <h1>Book a Photographer</h1>
        
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <label for="photographer">Select Photographer</label>
            <select id="photographer" name="photographer" required>
                <option value="">Choose a photographer...</option>
                <option value="emma">Emma van Berg</option>
                <option value="lars">Lars de Vries</option>
                <option value="sophie">Sophie Janssen</option>
            </select>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>

            <label for="notes">Additional Notes</label>
            <textarea id="notes" name="notes" placeholder="Tell us about your photography needs..."></textarea>

            <button type="submit" class="btn">Submit Booking Request</button>
        </form>
    </div>
</body>
</html>
