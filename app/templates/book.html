<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Photographers - Culex</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #2563eb;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1f2937;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .booking-form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .flash-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }
    </style>
    <script>
        function loadPhotographerSlots() {
            const photographerId = document.getElementById('photographer_id').value;
            const slotSelect = document.getElementById('slot_id');
            
            if (!photographerId) {
                slotSelect.innerHTML = '<option value="">First select a photographer</option>';
                return;
            }
            
            slotSelect.innerHTML = '<option value="">Loading...</option>';
            
            fetch(`/api/photographer-slots/${photographerId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        slotSelect.innerHTML = '<option value="">No available slots</option>';
                    } else {
                        slotSelect.innerHTML = '<option value="">Select a time slot...</option>';
                        data.forEach(slot => {
                            const option = document.createElement('option');
                            option.value = slot.id;
                            option.textContent = slot.display;
                            slotSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    slotSelect.innerHTML = '<option value="">Error loading slots</option>';
                });
        }
    </script>
</head>
<body>
    <nav>
        <div class="logo">Culex</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">Home</a>
            <a href="{{ url_for('main.book') }}">Find Photographers</a>
            <a href="{{ url_for('main.bookings') }}">My Bookings</a>
        </div>
    </nav>

    <div class="container">
        <h1>Book a Photographer</h1>
        <p class="subtitle">Select your preferred photographer and time slot</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="booking-form">
            <div class="form-group">
                <label for="photographer_id">Select Photographer *</label>
                <select id="photographer_id" name="photographer_id" required onchange="loadPhotographerSlots()">
                    <option value="">Choose a photographer...</option>
                    {% for id, info in photographers.items() %}
                        <option value="{{ id }}">{{ info.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="slot_id">Available Time Slots *</label>
                <select id="slot_id" name="slot_id" required>
                    <option value="">First select a photographer</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Your Name *</label>
                <input type="text" id="name" name="name" value="{{ session.get('user_name', '') }}" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" placeholder="Tell us about your photography needs..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Submit Booking Request</button>
        </form
    </div>
</body>
</html>
