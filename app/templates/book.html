<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Photographer - De Kodak</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fafbfc;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }
        .nav-links a {
            margin-left: 30px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 32px;
            color: #333;
        }
        .success-message {
            background: #4caf50;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn {
            width: 100%;
            background: #1E88E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1565C0;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">De Kodak</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">HOME</a>
        </div>
    </nav>

    <div class="container">
        <h1>Book a Photographer</h1>
        
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <label for="photographer">Select Photographer</label>
            <select id="photographer" name="photographer_id" required onchange="loadPhotographerSlots()">
                <option value="">Choose a photographer...</option>
                {% for pid, photo in photographers.items() %}
                    <option value="{{ pid }}">{{ photo.name }}</option>
                {% endfor %}
            </select>

            <label for="slot">Available Date & Time</label>
            <select id="slot" name="slot_id" required>
                <option value="">Select a photographer first...</option>
            </select>

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>

            <label for="notes">Additional Notes</label>
            <textarea id="notes" name="notes" placeholder="Tell us about your photography needs..."></textarea>

            <button type="submit" class="btn">Submit Booking Request</button>
        </form>
    </div>

    <script>
        const availabilityData = {{ availability|safe }};

        function loadPhotographerSlots() {
            const photographerId = document.getElementById('photographer').value;
            const slotSelect = document.getElementById('slot');
            
            // Clear previous options
            slotSelect.innerHTML = '<option value="">Loading...</option>';
            
            if (!photographerId) {
                slotSelect.innerHTML = '<option value="">Select a photographer first...</option>';
                return;
            }
            
            // Fetch slots from API
            fetch(`/api/photographer-slots/${photographerId}`)
                .then(response => response.json())
                .then(slots => {
                    slotSelect.innerHTML = '<option value="">Select a time slot...</option>';
                    
                    if (slots.length === 0) {
                        slotSelect.innerHTML = '<option value="">No available slots for this photographer</option>';
                        return;
                    }
                    
                    slots.forEach(slot => {
                        const option = document.createElement('option');
                        option.value = slot.id;
                        option.textContent = slot.display;
                        slotSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading slots:', error);
                    slotSelect.innerHTML = '<option value="">Error loading slots</option>';
                });
        }
    </script>
</body>
</html>
