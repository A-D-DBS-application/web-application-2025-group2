<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Photographer - {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/book.css') }}">
</head>
<body>
    <nav>
        <div class="logo">{{ app_name }}</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">HOME</a>
        </div>
    </nav>

    <div class="container">
        <h1>Book a Photographer</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="photographer">Select Photographer</label>
            <select id="photographer" name="photographer_id" required onchange="loadPhotographerSlots()">
                <option value="">Choose a photographer...</option>
                {% for pid, photo in photographers.items() %}
                    <option value="{{ pid }}">{{ photo.name }}</option>
                {% endfor %}
            </select>

            <label for="slot">Available Date & Time</label>
            <select id="slot" name="slot_id" required>
                <option value="">Select a photographer first...</option>
            </select>

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>

            <label for="notes">Additional Notes</label>
            <textarea id="notes" name="notes" placeholder="Tell us about your photography needs..."></textarea>

            <button type="submit" class="btn">Submit Booking Request</button>
        </form>
    </div>

    <script>
        function loadPhotographerSlots() {
            const photographerId = document.getElementById('photographer').value;
            const slotSelect = document.getElementById('slot');
            
            slotSelect.innerHTML = '<option value="">Loading...</option>';
            
            if (!photographerId) {
                slotSelect.innerHTML = '<option value="">Select a photographer first...</option>';
                return;
            }
            
            fetch(`/api/photographer-slots/${photographerId}`)
                .then(response => response.json())
                .then(slots => {
                    slotSelect.innerHTML = '<option value="">Select a time slot...</option>';
                    
                    if (slots.length === 0) {
                        slotSelect.innerHTML = '<option value="">No available slots</option>';
                        return;
                    }
                    
                    slots.forEach(slot => {
                        const option = document.createElement('option');
                        option.value = slot.id;
                        option.textContent = slot.display;
                        slotSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    slotSelect.innerHTML = '<option value="">Error loading slots</option>';
                });
        }
    </script>
</body>
</html>
